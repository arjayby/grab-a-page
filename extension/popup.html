<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Grab a Page</title>
  <link rel="stylesheet" href="design-system.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="popup-header">
    <div class="brand"><img class="brand-mark" src="icons/mark.svg" alt=""><span>Grab a Page</span></div>
    <span class="ready"><span class="dot" aria-hidden="true"></span><span id="state-label">Ready</span></span>
  </header>
  <main>
    <section class="intro" aria-labelledby="headline">
      <h1 id="headline">From the first pixel<br>To the very last.</h1>
    </section>
    <div class="capture-modes" aria-label="Capture mode">
      <button id="full" class="capture">
        <strong>Capture full page</strong>
        <small>Scrolls the entire page</small>
      </button>
      <button id="visible" class="capture">
        <strong>Capture visible area</strong>
        <small>Current screen only</small>
      </button>
    </div>
    <p class="hint"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 11v6m0-10v1"/></svg>Keep this tab active while capturing.</p>
    <section id="running" hidden aria-live="polite" aria-label="Capture progress">
      <div class="eyebrow"><span class="dot" aria-hidden="true"></span> Capture in progress</div>
      <p id="progress"></p>
      <div class="activity-track" aria-hidden="true"><span></span></div>
      <div class="actions"><button id="finish" class="button primary">Finish now</button><button id="cancel" class="button">Cancel</button></div>
    </section>
    <p id="error" class="notice" role="alert" hidden></p>
    <button id="last" class="last-capture" hidden><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11a9 9 0 1 1 3 8M3 5v6h6m3-4v5l3 2"/></svg><span>Open last capture</span><span aria-hidden="true">↗</span></button>
    <details>
      <summary><span class="eyebrow">Capture settings</span><span class="toggle" aria-hidden="true"></span></summary>
      <div class="settings-panel">
        <form id="settings">
          <p class="settings-intro">Your page. Your pace.</p>
          <label class="output-field" for="image-output">Image output
            <span class="select-wrap">
              <select id="image-output" name="imageOutput"><option value="single">One full-page PNG</option><option value="multiple">Multiple PNGs for large pages</option></select>
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
            </span>
          </label>
          <div class="settings-grid">
            <label for="max-duration">Maximum duration<span class="input-wrap"><input id="max-duration" name="maxDuration" type="number" min="10" max="600" step="1" required><span class="unit" aria-hidden="true">sec</span></span><small>10–600 seconds</small></label>
            <label for="max-height">Page height limit<span class="input-wrap"><input id="max-height" name="maxHeight" type="number" min="1000" max="100000" step="1" required><span class="unit" aria-hidden="true">px</span></span><small>1,000–100,000 pixels</small></label>
            <label for="scroll-pause">Scroll pause<span class="input-wrap"><input id="scroll-pause" name="waitMs" type="number" min="300" max="5000" step="1" required><span class="unit" aria-hidden="true">ms</span></span><small>300–5,000 milliseconds</small></label>
            <label for="image-wait">Image loading wait<span class="input-wrap"><input id="image-wait" name="loadTimeout" type="number" min="1000" max="10000" step="1" required><span class="unit" aria-hidden="true">ms</span></span><small>1,000–10,000 milliseconds</small></label>
          </div>
          <div class="save-row"><button type="submit" class="button">Save settings <span aria-hidden="true">↗</span></button><span id="saved" role="status"></span></div>
        </form>
      </div>
    </details>
  </main>
  <footer><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 8 3v6c0 5-8 9-8 9s-8-4-8-9V6zM8 12l3 3 5-6"/></svg><span>Private. On your device. No uploads.</span></footer>
  <script type="module" src="popup.js"></script>
</body>
</html>
